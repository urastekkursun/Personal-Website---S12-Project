# Netlify'a deploy edilirse vercel.json yerine bu dosya geçerli olur.
# İki dosyada da aynı güvenlik başlıkları tanımlı; birini değiştirirsen
# diğerini de güncelle.

[build]
  command = "npm run build"
  publish = "dist"

# SPA: bilinmeyen path'ler index.html'e düşsün (uygulama içi NotFound devreye girer)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# NOT: script-src içindeki sha256 hash'i index.html'deki JSON-LD (structured
# data) bloğuna ait. O bloğu düzenlersen hash'i yeniden üret:
#   node -e "const f=require('fs'),c=require('crypto');const m=f.readFileSync('index.html','utf8').match(/<script type=\"application\/ld\+json\">([\s\S]*?)<\/script>/);console.log('sha256-'+c.createHash('sha256').update(m[1],'utf8').digest('base64'))"
# ve vercel.json'daki değeri de güncelle.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-8pk/b6OErMQfvhARPjl2ChEZSJomK1cdWQTB5siwYQE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://reqres.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
